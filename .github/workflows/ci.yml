name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# On PRs, a newer push cancels the in-progress run. Runs on main are never cancelled,
# so every merge commit gets its own pass/fail status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACR_NAME: crsunnyscarsdev01
  IMAGE: crsunnyscarsdev01.azurecr.io/sunnyscars-inventory-api

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real MongoDB for the MongoCarStore tests, which are skipped without SUNNYSCARS_TEST_MONGO.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the SDK pinned in global.json, so CI and local builds match.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # A failing test exits non-zero, which fails this step and the workflow.
      # The GitHubActions logger annotates failing tests on the PR and writes a job summary.
      - name: Test
        env:
          SUNNYSCARS_TEST_MONGO: mongodb://localhost:27017
        run: >-
          dotnet test --no-build --verbosity normal
          --logger GitHubActions
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  docker-build:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Same command used to build for Azure Container Registry, so a broken Dockerfile fails the PR. Nothing is pushed.
      - name: Build image for linux/amd64
        run: docker build --platform linux/amd64 -f SunnysCars.Inventory.Api/Dockerfile -t sunnyscars-inventory-api:ci .

  deploy:
    name: Deploy
    # Only after a merge (a push to main) and only once both CI jobs have passed.
    # Pull requests and other branches never reach this job.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build-and-test, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Deploys queue instead of overlapping. If several merges land at once, only the newest waiting one runs.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write # OIDC token for azure/login, so no Azure password is stored in GitHub

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Federated credential on an Entra app registration with AcrPush on the registry
      # (and Website Contributor on the App Service, once it exists).
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      # The commit SHA tag is immutable and is what App Service runs. latest always points at the newest main build.
      - name: Build and push image for linux/amd64
        run: |
          docker build --platform linux/amd64 -f SunnysCars.Inventory.Api/Dockerfile \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "Pushed \`$IMAGE:$GITHUB_SHA\` and \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"

      # The App Service steps are skipped until the repository variable AZURE_WEBAPP_NAME is set (SCI-7).
      # Without the pull identity's client id, the deploy below would drop it and the app couldn't pull from ACR.
      - name: Check App Service variables
        if: ${{ vars.AZURE_WEBAPP_NAME != '' && vars.ACR_PULL_IDENTITY_CLIENT_ID == '' }}
        run: |
          echo "::error::Set the repository variable ACR_PULL_IDENTITY_CLIENT_ID to the client id of id-sunnyscars-dev-01."
          exit 1

      # The app uses site containers, so this replaces its "main" container; `images:` would switch it back to a
      # single classic container. The update is a full replace, so it restates every setting from the portal:
      # pull with the user-assigned identity id-sunnyscars-dev-01, port 8080, and the app settings and connection
      # strings (Mongo).
      - name: Deploy image to App Service
        id: webapp
        if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          sitecontainers-config: |
            [
              {
                "name": "main",
                "image": "${{ env.IMAGE }}:${{ github.sha }}",
                "isMain": true,
                "targetPort": "8080",
                "authType": "UserAssigned",
                "userManagedIdentityClientId": "${{ vars.ACR_PULL_IDENTITY_CLIENT_ID }}",
                "inheritAppSettingsAndConnectionStrings": true
              }
            ]

      # GET /v1/cars needs both the container and MongoDB, so a 200 means the deployed API is healthy.
      # A free-tier container can take a few minutes to pull and start, so this retries for up to ~5 minutes.
      - name: Smoke test
        if: ${{ steps.webapp.outcome == 'success' }}
        env:
          WEBAPP_URL: ${{ steps.webapp.outputs.webapp-url }}
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 20 --retry-delay 15 --retry-all-errors --max-time 30
          "${WEBAPP_URL%/}/v1/cars"
