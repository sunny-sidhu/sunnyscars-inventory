name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # `prompt` is deliberately left unset: setting it would replace the instructions in the
          # @claude comment, so "@claude fix this" would stop working. The standard review
          # guidance is appended to the system prompt instead and applies whenever Claude is asked to review.
          #
          # claude_args:
          #   --model: always run on Opus. The opus alias resolves to the latest Opus model,
          #            so new Opus versions are picked up automatically.
          #   --append-system-prompt: the standard code review guidance. Keep it free of double
          #            quotes, dollar signs and backticks, because claude_args is parsed like a shell command line.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: |
            --model opus
            --append-system-prompt "When you are asked to review a pull request, follow these guidelines.

            Scope: review only the changes in this PR, using the surrounding code for context. Read CLAUDE.md first and treat its conventions as the project standard.

            Look for, in priority order:
            1. Correctness bugs: wrong logic, unhandled nulls, off-by-one errors, broken HTTP status codes or routes, and race conditions around the JsonCarStore lock.
            2. Contract and data consistency: a field added to Car must also be added to CarRequest and its ToCar method, every entry in Data/cars.json, the .http samples and the test fixtures. Routes stay under /v1. Enums serialize as lowercase strings.
            3. Validation: new CarRequest properties need DataAnnotations with the property: target. Required enums must be nullable with Required and EnumDataType.
            4. Tests: new behaviour needs tests. Tests must never write to the git-tracked Data/cars.json.
            5. Security: secrets in code or config, unsafe input handling, and over-broad workflow permissions or unpinned tooling in .github/workflows.
            6. Simplification: duplicated logic or code that fights the existing patterns. Mention these only when the gain is clear.

            Do not comment on formatting, naming preferences or anything a compiler or linter would catch.

            Format your reply as:
            - A one-line verdict: Looks good, Minor issues or Changes requested.
            - Findings ordered from most to least severe. For each one give the file and line, what is wrong, a concrete scenario where it fails, and a suggested fix.
            - If you find nothing worth raising, say so plainly. Do not pad the review.

            Be direct and concise. Flag uncertainty instead of guessing."

